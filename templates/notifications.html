<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Notifications</title>
  <style>
    :root {
      --c-bg: #f5f7fb;
      --c-surface: #ffffff;
      --c-primary: #0f2749;
      --c-primary-accent: #3e75c2;
      --c-border: #dbe2ea;
      --c-danger: #c0392b;
      --c-danger-hover: #922b21;
      --c-muted: #6b7280;
      --radius-sm: 4px;
      --radius: 10px;
      --shadow: 0 4px 12px rgba(0,0,0,0.08);
      --font-stack: 'Segoe UI', 'Inter', system-ui, Arial, sans-serif;
    }
    * { box-sizing: border-box; margin:0; padding:0; font-family: var(--font-stack); }
    body { background: var(--c-bg); min-height:100vh; color:#1f2937; padding: clamp(12px,2vw,32px); }
    .nav { display:flex; align-items:center; gap:16px; margin-bottom:24px; }
    .logo-btn { width:130px; height:46px; background: url('https://i.postimg.cc/nLt7Kfnk/Mobile-Banking-Logo.png') center/contain no-repeat; border:none; cursor:pointer; }
    h1 { font-size: clamp(1.5rem,2.2vw,2.1rem); color: var(--c-primary); font-weight:600; letter-spacing:.5px; }
    .panel { background: var(--c-surface); border-radius: var(--radius); padding: clamp(16px,1.6vw,28px); box-shadow: var(--shadow); border:1px solid #eef1f5; }
    .toolbar { display:flex; flex-wrap:wrap; gap:10px; align-items:center; margin-bottom:18px; }
    .toolbar-group { display:flex; gap:8px; align-items:center; }
    select, .search-box { padding:8px 10px; border:1px solid var(--c-border); border-radius: var(--radius-sm); font-size:.9rem; min-width:130px; }
    select:focus, .search-box:focus { outline:2px solid var(--c-primary-accent); outline-offset:1px; }
    .btn { border:none; background: var(--c-primary); color:#fff; padding:9px 16px; font-size:.85rem; font-weight:600; border-radius: var(--radius-sm); display:inline-flex; gap:6px; align-items:center; cursor:pointer; letter-spacing:.5px; transition:background .18s, box-shadow .18s; }
    .btn:hover { background: var(--c-primary-accent); }
    .btn-outline { background:#fff; color: var(--c-primary); border: 1px solid var(--c-primary); }
    .btn-outline:hover { background: var(--c-primary); color:#fff; }
    .btn-danger { background: var(--c-danger); }
    .btn-danger:hover { background: var(--c-danger-hover); }
    .notif-list { list-style:none; display:flex; flex-direction:column; gap:10px; }
    .notif-item { position:relative; display:flex; gap:14px; padding:14px 16px 14px 18px; background: linear-gradient(90deg,#ffffff,#f2f7fb); border:1px solid #e2e8f0; border-left:4px solid var(--c-primary-accent); border-radius: var(--radius-sm); box-shadow: 0 1px 2px rgba(0,0,0,0.04); transition: border-color .25s, transform .12s; cursor:default; }
    .notif-item.unread { background: linear-gradient(90deg,#f0f7ff,#ffffff); border-left-color: #ffb347; }
    .notif-item:active { transform: scale(.985); }
    .notif-icon { font-size:1.3rem; line-height:1; }
    .notif-content { flex:1; min-width:0; }
    .notif-title { font-weight:600; font-size:.92rem; margin-bottom:2px; color:#111827; letter-spacing:.3px; }
    .notif-msg { font-size:.82rem; line-height:1.25rem; color:#374151; overflow-wrap: anywhere; }
    .notif-meta { margin-top:6px; font-size:.7rem; color: var(--c-muted); display:flex; gap:12px; align-items:center; flex-wrap:wrap; }
    .notif-actions { display:flex; gap:6px; margin-top:6px; }
    .chip { font-size:.62rem; padding:2px 6px; border-radius:20px; background:#e5ecf5; color:#334155; text-transform:uppercase; letter-spacing:.5px; font-weight:600; }
    .chip.credit { background:#dcfce7; color:#166534; }
    .chip.debit { background:#fee2e2; color:#991b1b; }
    .chip.info { background:#e0f2fe; color:#075985; }
    .chip.split { background:#fef9c3; color:#854d0e; }
    .chip.request { background:#fae8ff; color:#86198f; }
    .empty { text-align:center; padding:40px 10px; color: var(--c-muted); font-size:.95rem; }
    .bulk-bar { display:flex; justify-content:space-between; align-items:center; padding:10px 14px; background:#f0f4f9; border:1px solid #e2e8f0; border-radius: var(--radius-sm); font-size:.8rem; margin-bottom:14px; }
    .pagination { display:flex; gap:6px; flex-wrap:wrap; margin-top:24px; justify-content:space-between; align-items:center; }
    .pages { display:flex; gap:4px; flex-wrap:wrap; }
    .page-btn { border:1px solid var(--c-border); background:#fff; padding:6px 10px; font-size:.75rem; border-radius: var(--radius-sm); cursor:pointer; min-width:34px; }
    .page-btn.active { background: var(--c-primary); color:#fff; border-color: var(--c-primary); }
    .page-btn:hover { background:#f1f5f9; }
    .status-bar { font-size:.7rem; color: var(--c-muted); }
    .flex-spacer { flex:1; }
    .row { display:flex; flex-wrap:wrap; gap:14px; }
    .search-box { flex:1; }
    .footer-actions { display:flex; gap:12px; margin-top:32px; justify-content:center; }
    .select-col { width:26px; display:flex; align-items:flex-start; }
    .checkbox { margin-top:2px; }
    @media (max-width:650px){
      .notif-item { flex-direction:column; }
      .notif-actions { flex-wrap:wrap; }
      .toolbar { flex-direction:column; align-items:stretch; }
      .toolbar-group { width:100%; justify-content:space-between; }
      .search-box { width:100%; }
      .bulk-bar { flex-direction:column; align-items:flex-start; gap:8px; }
    }
  </style>
</head>
<body>

  <div class="nav">
    <button class="logo-btn" onclick="location.href='/dashboard'"></button>
    <h1>Notifications</h1>
  </div>

  <div class="panel">
    <div class="toolbar" role="region" aria-label="Filters and actions">
      <div class="toolbar-group">
        <label for="filterType" style="font-size:.7rem; font-weight:600; color:var(--c-muted); letter-spacing:1px;">TYPE</label>
        <select id="filterType" aria-label="Filter by type">
          <option value="all">All</option>
          <option value="credit">Credit</option>
          <option value="debit">Debit</option>
          <option value="info">Info</option>
          <option value="split">Split</option>
          <option value="request">Request</option>
        </select>
      </div>
      <div class="toolbar-group">
        <label for="filterState" style="font-size:.7rem; font-weight:600; color:var(--c-muted); letter-spacing:1px;">STATUS</label>
        <select id="filterState" aria-label="Filter by read/unread">
          <option value="all">All</option>
          <option value="unread">Unread</option>
        </select>
      </div>
      <div class="toolbar-group" style="flex:1;">
        <input id="searchBox" class="search-box" placeholder="Search title or message..." aria-label="Search notifications" />
      </div>
      <div class="toolbar-group">
        <button id="refreshBtn" class="btn btn-outline" title="Refresh list">🔄 Refresh</button>
        <button id="markAllReadBtn" class="btn btn-outline" title="Mark all as read">✓ Mark All Read</button>
        <button id="clearAllBtn" class="btn btn-danger" title="Delete all notifications">🗑 Clear All</button>
      </div>
    </div>

    <div id="bulkBar" class="bulk-bar" style="display:none;" aria-live="polite">
      <div><span id="selectedCount">0</span> selected</div>
      <div class="bulk-actions" style="display:flex; gap:8px;">
        <button id="bulkReadBtn" class="btn btn-outline" style="padding:6px 12px;">Mark Read</button>
        <button id="bulkUnreadBtn" class="btn btn-outline" style="padding:6px 12px;">Mark Unread</button>
        <button id="bulkClearSelection" class="btn btn-outline" style="padding:6px 12px;">Clear Selection</button>
      </div>
    </div>

    <ul id="notifList" class="notif-list" aria-live="polite"></ul>
    <div id="emptyState" class="empty" style="display:none;">No notifications match your filters.</div>

    <div class="pagination" aria-label="Pagination navigation">
      <div class="status-bar" id="statusBar">Page 1</div>
      <div class="pages" id="pages"></div>
      <div style="font-size:.65rem; color:var(--c-muted);">Auto-refresh every 60s</div>
    </div>

    <div class="footer-actions">
      <a href="/dashboard" class="btn btn-outline">Dashboard</a>
    </div>
  </div>

  <script>
    (function(){
      const listEl = document.getElementById('notifList');
      const emptyState = document.getElementById('emptyState');
      const pagesEl = document.getElementById('pages');
      const statusBar = document.getElementById('statusBar');
      const filterType = document.getElementById('filterType');
      const filterState = document.getElementById('filterState');
      const searchBox = document.getElementById('searchBox');
      const refreshBtn = document.getElementById('refreshBtn');
      const markAllReadBtn = document.getElementById('markAllReadBtn');
      const clearAllBtn = document.getElementById('clearAllBtn');
      const bulkBar = document.getElementById('bulkBar');
      const bulkReadBtn = document.getElementById('bulkReadBtn');
      const bulkUnreadBtn = document.getElementById('bulkUnreadBtn');
      const bulkClearSelection = document.getElementById('bulkClearSelection');
      const selectedCount = document.getElementById('selectedCount');

      let state = {
        page: 1,
        per_page: 10,
        type: 'all',
        unreadOnly: false,
        total_pages: 1,
        data: [],
        selection: new Set(),
        search: ''
      };

      function applyClientFilters(items){
        const s = state.search.trim().toLowerCase();
        if(!s) return items;
        return items.filter(n => (n.title + ' ' + n.message).toLowerCase().includes(s));
      }

      function renderList(){
        listEl.innerHTML='';
        const filtered = applyClientFilters(state.data);
        if(filtered.length === 0){
          emptyState.style.display='block';
          return;
        }
        emptyState.style.display='none';
        filtered.forEach(n => {
          const li = document.createElement('li');
          li.className = 'notif-item' + (n.read ? '' : ' unread');
          li.dataset.id = n.id;
          li.innerHTML = `<div class="select-col"><input type="checkbox" class="checkbox" aria-label="Select notification" /></div>
            <div class="notif-icon" aria-hidden="true">${n.icon || '🔔'}</div>
            <div class="notif-content">
              <div class="notif-title">${escapeHtml(n.title)}</div>
              <div class="notif-msg">${escapeHtml(n.message)}</div>
              <div class="notif-meta">
                <span>${n.created_at} (${n.created_ago})</span>
                <span class="chip ${n.type? n.type.toLowerCase():''}">${(n.type||'').toUpperCase()}</span>
                <span>${n.read? 'Read':'Unread'}</span>
              </div>
              <div class="notif-actions">
                <button class="btn btn-outline btn-xs mark-btn" data-action="${n.read? 'unread':'read'}">${n.read? 'Mark Unread':'Mark Read'}</button>
              </div>
            </div>`;
          listEl.appendChild(li);
        });
      }

      function renderPagination(){
        pagesEl.innerHTML='';
        const { page, total_pages } = state;
        statusBar.textContent = `Page ${page} / ${total_pages}`;
        function addBtn(p,label){
          const b = document.createElement('button');
          b.className = 'page-btn' + (p===page?' active':'');
          b.textContent = label || p;
          b.addEventListener('click', ()=> { if(p!==page){ state.page=p; fetchPage(); } });
          pagesEl.appendChild(b);
        }
        if(total_pages <= 7){
          for(let p=1;p<=total_pages;p++) addBtn(p);
        } else {
          addBtn(1);
          if(page>3) pagesEl.appendChild(ellipsis());
            const start = Math.max(2,page-1);
            const end = Math.min(total_pages-1,page+1);
            for(let p=start;p<=end;p++) addBtn(p);
          if(page < total_pages-2) pagesEl.appendChild(ellipsis());
          addBtn(total_pages);
        }
      }
      function ellipsis(){ const span=document.createElement('span'); span.textContent='…'; span.style.padding='6px 4px'; span.style.fontSize='.8rem'; span.style.color='var(--c-muted)'; return span; }

      async function fetchPage(){
        const params = new URLSearchParams({ page: state.page, per_page: state.per_page, type: state.type });
        if(state.unreadOnly) params.set('unread','1');
        const res = await fetch('/notifications/api/list?'+params.toString());
        const data = await res.json();
        if(!data.success){ console.warn(data.message); return; }
        state.total_pages = data.total_pages || 1;
        state.page = data.page;
        state.data = data.notifications || [];
        // Clear selection if items changed
        state.selection.clear(); updateSelectionUI();
        renderList();
        renderPagination();
      }

      async function bulkMark(action, ids){
        if(ids.length===0) return;
        const endpoint = action==='read'? '/notifications/api/mark_read' : '/notifications/api/mark_unread';
        await fetch(endpoint, { method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ ids }) });
        await fetchPage();
      }

      function updateSelectionUI(){
        const count = state.selection.size;
        selectedCount.textContent = count;
        bulkBar.style.display = count>0 ? 'flex':'none';
      }

      // Event handlers
      filterType.addEventListener('change', ()=> { state.type=filterType.value; state.page=1; fetchPage(); });
      filterState.addEventListener('change', ()=> { state.unreadOnly = filterState.value==='unread'; state.page=1; fetchPage(); });
      refreshBtn.addEventListener('click', ()=> fetchPage());
      markAllReadBtn.addEventListener('click', async ()=> { await fetch('/notifications/api/mark_read',{ method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ mark_all:true })}); fetchPage(); });
      clearAllBtn.addEventListener('click', async ()=> { if(!confirm('Delete ALL notifications? This cannot be undone.')) return; const res = await fetch('/notifications/api/clear_all',{ method:'POST' }); const d= await res.json(); if(!d.success) alert(d.message||'Failed'); fetchPage(); });
      bulkReadBtn.addEventListener('click', ()=> bulkMark('read', Array.from(state.selection)) );
      bulkUnreadBtn.addEventListener('click', ()=> bulkMark('unread', Array.from(state.selection)) );
      bulkClearSelection.addEventListener('click', ()=> { state.selection.clear(); updateSelectionUI(); document.querySelectorAll('.notif-item input[type=checkbox]').forEach(cb=> cb.checked=false); });

      listEl.addEventListener('click', async (e)=> {
        const li = e.target.closest('.notif-item');
        if(!li) return;
        // Checkbox selection
        if(e.target.matches('input[type=checkbox]')){
          const id = parseInt(li.dataset.id); if(e.target.checked) state.selection.add(id); else state.selection.delete(id); updateSelectionUI(); return; }
        if(e.target.classList.contains('mark-btn')){
          const id = parseInt(li.dataset.id);
          const action = e.target.dataset.action;
            await bulkMark(action, [id]);
        }
      });

      // Debounced search
      let searchTimer; searchBox.addEventListener('input', ()=> { clearTimeout(searchTimer); searchTimer=setTimeout(()=> { state.search=searchBox.value; renderList(); }, 250); });

      // Auto refresh (maintain page/filters if user idle)
      setInterval(()=> { fetchPage(); }, 60000);

      function escapeHtml(str){ return str.replace(/[&<>'"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;','\'':'&#39;'}[c])); }

      // Initial load
      fetchPage();
    })();
  </script>
</body>
</html>
