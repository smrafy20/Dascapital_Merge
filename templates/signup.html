<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Signup - Mobile Banking</title>
  <style>
    * { box-sizing: border-box; font-family: playfair display; }
    body {
      margin: 0; padding: 0;
      background-image: url('https://i.postimg.cc/k4zVhP2t/MB-Home.png');
      background-size: cover; background-position: center; background-attachment: fixed;
      color: #fff; min-height: 100vh;
    }
    .navbar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 15px 20px; background-color: #0f2749;
    }
    .logo-btn {
      width: 120px; height: 40px; background-color: transparent; border: none; cursor: pointer;
      background-image: url('https://i.postimg.cc/nLt7Kfnk/Mobile-Banking-Logo.png');
      background-size: contain; background-repeat: no-repeat; background-position: center;
    }
    .form-wrapper { display: flex; justify-content: center; padding: 40px 20px; }
    .form-container {
      background-color: #0f2749; color: #aac5ea; width: 100%; max-width: 420px;
      padding: 30px 32px; border-radius: 10px; box-shadow: 0 0 10px rgba(0,0,0,0.5);
      margin-top: 40px;
    }
    .form-container h1 { text-align: center; margin-bottom: 8px; }
    .form-container p { text-align: center; margin-bottom: 18px; }
    .form-group { margin-bottom: 14px; }
    .form-group label { display: block; margin-bottom: 6px; color: #aac5ea; }
    .form-group input { width: 100%; padding: 12px; border: none; border-radius: 4px; background-color: #fff; color: #000; }
    .checkbox { display: flex; align-items: center; gap: 8px; margin: 12px 0 6px; color: #aac5ea; font-size: 14px; }
    .actions { display: flex; flex-direction: column; gap: 10px; margin-top: 14px; }
    .btn { padding: 12px; border: none; border-radius: 4px; font-weight: bold; cursor: pointer; }
    .btn-primary { background-color: #aac5ea; color: #000; }
    .btn-secondary { background-color: #ccc; color: #0f1c2e; }
    .error-message { color: #ff4444; background: rgba(255,255,255,0.8); padding: 8px 10px; border-radius: 4px; margin: 8px 0; }
    .flash { color: #ffdfdf; background: rgba(255,0,0,0.15); padding: 10px; border: 1px solid rgba(255,0,0,0.3); border-radius: 6px; margin-bottom: 12px; }
    /* visual validation */
    .invalid-input { border: 2px solid #ff4444 !important; box-shadow: 0 0 6px rgba(255,68,68,0.25); }
    .helper-text { font-size: 12px; color: #aac5ea; margin-top: 6px; }
  </style>
</head>

<body>
  <nav class="navbar">
    <button class="logo-btn" onclick="window.location.href='{{ url_for('auth.home') }}'"></button>
  </nav>

  <div class="form-wrapper">
    <div class="form-container">
      <h1>Create An Account</h1>
      <p>Already have an account? <a href="/login" style="color:#3e75c2; text-decoration: none;">Sign in here!</a></p>

      {% with messages = get_flashed_messages() %}
        {% if messages %}
          <div class="flash">{{ messages[0] }}</div>
        {% endif %}
      {% endwith %}

      <form id="signupForm" method="POST" action="/signup">
        <div class="form-group">
          <label for="firstName">First Name</label>
          <input type="text" id="firstName" name="firstName" placeholder="First Name" required>
        </div>
        <div class="form-group">
          <label for="lastName">Last Name</label>
          <input type="text" id="lastName" name="lastName" placeholder="Last Name" required>
        </div>

        <div class="form-group">
          <label for="email">Email</label>
          <input type="email" id="email" name="email" placeholder="Email" required>
          <div id="emailError" class="error-message" style="display: none;"></div>
        </div>

        <div class="form-group">
          <label for="phone">Phone Number</label>
          <input type="text" id="phone" name="phone" placeholder="Phone Number" required>
          <div id="phoneError" class="error-message" style="display: none;"></div>
        </div>

        <div class="form-group">
          <label for="nid">NID</label>
          <input type="text" id="nid" name="nid" placeholder="NID" required>
        </div>

        <div class="form-group">
          <label for="password">Create PIN</label>
          <div class="password-wrapper" style="position:relative;">
            <input type="password" id="password" name="password" placeholder="Create PIN" required style="padding-right:72px;">
            <button type="button" id="togglePassword" aria-label="Show PIN" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#0f2749;font-weight:bold;cursor:pointer;">Show</button>
          </div>
          <div class="helper-text" style="font-size:12px;color:#aac5ea;margin-top:6px;">Must be at least 4 digits.</div>
        </div>

        <div class="form-group">
          <label for="confirmPassword">Confirm PIN</label>
          <div class="password-wrapper" style="position:relative;">
            <input type="password" id="confirmPassword" name="confirmPassword" placeholder="Confirm PIN" required style="padding-right:72px;">
            <button type="button" id="toggleConfirm" aria-label="Show Confirm PIN" style="position:absolute;right:8px;top:50%;transform:translateY(-50%);background:transparent;border:none;color:#0f2749;font-weight:bold;cursor:pointer;">Show</button>
          </div>
          <div id="pinMatchError" class="error-message" style="display:none;">PINs do not match.</div>
        </div>

        <div class="form-group">
          <label for="dob">Date of Birth</label>
          <input type="date" id="dob" name="dob" placeholder="Date of Birth" required>
        </div>

        <div class="checkbox">
          <input type="checkbox" id="termsCheckbox" required>
          <label for="termsCheckbox">Creating your account means you accept our <a href="#">Terms & Conditions</a>.</label>
        </div>

        <div class="actions">
          <button type="submit" class="btn btn-primary" id="submitBtn" disabled>Create Account</button>
        </div>
      </form>
    </div>
  </div>

  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const form = document.getElementById('signupForm');
      const firstName = form.elements['firstName'];
      const lastName = form.elements['lastName'];
      const phone = form.elements['phone'];
      const email = form.elements['email'];
      const nid = form.elements['nid'];
      const password = form.elements['password'];
  const confirmPassword = form.elements['confirmPassword'];
      const dob = form.elements['dob'];
      const checkbox = document.getElementById('termsCheckbox');
      const submitBtn = document.getElementById('submitBtn');

      const phoneErrorDiv = document.getElementById('phoneError');
      const emailErrorDiv = document.getElementById('emailError');

      // Capitalize name inputs
      const capitalizeLive = (input) => {
        input.addEventListener('input', () => {
          let val = input.value;
          if (val.length > 0) {
            input.value = val.charAt(0).toUpperCase() + val.slice(1).toLowerCase();
          }
        });
      };
      capitalizeLive(firstName);
      capitalizeLive(lastName);

      // Enforce digit-only input (NID and PIN)
      const enforceDigitInput = (input, maxLength) => {
        input.addEventListener('input', () => {
          input.value = input.value.replace(/\D/g, '').slice(0, maxLength);
        });
      };
      enforceDigitInput(nid, 10);
      enforceDigitInput(password, 6); // allow up to 6 digits for PIN

      // show validation feedback only after user has interacted
      [firstName, lastName, phone, email, nid, password, dob].forEach(el => {
        el.addEventListener('blur', () => { el.dataset.touched = 'true'; validateForm(); });
      });

      // PIN show/hide toggles
      const toggleBtn = document.getElementById('togglePassword');
      const toggleConfirmBtn = document.getElementById('toggleConfirm');
      toggleBtn.addEventListener('click', () => {
        if (password.type === 'password') {
          password.type = 'text';
          toggleBtn.textContent = 'Hide';
          toggleBtn.setAttribute('aria-label', 'Hide PIN');
        } else {
          password.type = 'password';
          toggleBtn.textContent = 'Show';
          toggleBtn.setAttribute('aria-label', 'Show PIN');
        }
      });
      toggleConfirmBtn.addEventListener('click', () => {
        if (confirmPassword.type === 'password') {
          confirmPassword.type = 'text';
          toggleConfirmBtn.textContent = 'Hide';
          toggleConfirmBtn.setAttribute('aria-label', 'Hide Confirm PIN');
        } else {
          confirmPassword.type = 'password';
          toggleConfirmBtn.textContent = 'Show';
          toggleConfirmBtn.setAttribute('aria-label', 'Show Confirm PIN');
        }
      });

      // Phone validation
      phone.addEventListener('input', () => {
        phone.value = phone.value.replace(/\D/g, '').slice(0, 11);
        if (phone.value.length >= 2 && !phone.value.startsWith('01')) {
          phoneErrorDiv.textContent = "Phone number must start with '01'.";
          phoneErrorDiv.style.display = 'block';
        } else {
          phoneErrorDiv.textContent = "";
          phoneErrorDiv.style.display = 'none';
        }
        validateForm();
      });

      // Email validation
      email.addEventListener('input', () => {
        if (email.value.length > 0 && !/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value)) {
          emailErrorDiv.textContent = "Invalid email address.";
          emailErrorDiv.style.display = 'block';
        } else {
          emailErrorDiv.textContent = "";
          emailErrorDiv.style.display = 'none';
        }
        validateForm();
      });

  // Validate form for enabling submit
      const validateForm = () => {
        const isValidPhone = /^01\d{9}$/.test(phone.value);
        const isValidEmail = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email.value);
        const isValidNID = /^\d{10}$/.test(nid.value);
        const isNameFilled = firstName.value.trim() && lastName.value.trim();
  const isPasswordFilled = password.value.trim().length >= 4; // require at least 4 digits
  const isConfirmFilled = confirmPassword.value.trim().length >= 4;
  const pinsMatch = password.value === confirmPassword.value && isPasswordFilled && isConfirmFilled;
  const pinMatchErrorDiv = document.getElementById('pinMatchError');
        const isValidPIN = /^\d{4,6}$/.test(password.value);
        const isDOBFilled = dob.value;
        const isChecked = checkbox.checked;

        // Debug logging
        console.log('Validation check:', {
          isValidPhone, phone: phone.value,
          isValidEmail, email: email.value,
          isValidNID, nid: nid.value,
          isNameFilled, firstName: firstName.value, lastName: lastName.value,
          isPasswordFilled, password: password.value.length,
          isDOBFilled, dob: dob.value,
          isChecked
        });

  if (isValidPhone && isValidEmail && isValidNID && isNameFilled && isPasswordFilled && isDOBFilled && isChecked && pinsMatch) {
          submitBtn.disabled = false;
          console.log('Form is valid - enabling submit button');
        } else {
          submitBtn.disabled = true;
          console.log('Form is invalid - submit button disabled');
        }

        // visual invalid states: show when user touched the field or entered something
        const shouldShow = (el, valid) => {
          const touched = el.dataset.touched === 'true';
          return !valid && (touched || el.value.length > 0);
        };

        const setInvalid = (el, invalid) => {
          if (invalid) el.classList.add('invalid-input'); else el.classList.remove('invalid-input');
        };

        setInvalid(firstName, shouldShow(firstName, !!firstName.value.trim()));
        setInvalid(lastName, shouldShow(lastName, !!lastName.value.trim()));
        setInvalid(phone, shouldShow(phone, isValidPhone));
        setInvalid(email, shouldShow(email, isValidEmail));
        setInvalid(nid, shouldShow(nid, isValidNID));
        setInvalid(password, shouldShow(password, isValidPIN) || (shouldShow(confirmPassword, pinsMatch)) );
        setInvalid(confirmPassword, shouldShow(confirmPassword, pinsMatch));
        if (!pinsMatch && (confirmPassword.dataset.touched === 'true' || confirmPassword.value.length > 0)) {
          pinMatchErrorDiv.style.display = 'block';
        } else {
          pinMatchErrorDiv.style.display = 'none';
        }
        setInvalid(dob, shouldShow(dob, !!dob.value));
      };

      // Attach to all inputs
      [firstName, lastName, phone, email, nid, password, confirmPassword, dob].forEach(input => {
        input.addEventListener('input', validateForm);
      });
      checkbox.addEventListener('change', validateForm);
      
      // Initial validation check
      validateForm();
    });
  </script>
</body>
</html>
